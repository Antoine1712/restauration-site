<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desserts</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="animations.css">
</head>

<body>

<!-- MENU GLOBAL -->
<div id="menu-container"></div>

<script>
fetch("menu.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("menu-container").innerHTML = data;
  });
</script>

<!-- NAV PANIER -->
<nav class="nav">

    <div class="nav-spacer"></div>

    <a href="cart.html" class="cart-btn">
        🛒 <span id="cart-count">0</span>
    </a>

</nav>

<!-- SECTION DESSERTS -->
<section class="menu">
    <h2 class="section-title">Nos Desserts</h2>

    <div class="menu-grid">

        <div class="card">
            <img src="images/dessert1.jpg">
            <div class="card-content">
                <h3>Fondant Chocolat</h3>
                <p>Fondant au chocolat noir coulant</p>
                <div class="price">9€</div>
                <button onclick="addToCart('Fondant Chocolat',9)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/dessert2.jpg">
            <div class="card-content">
                <h3>Tiramisu</h3>
                <p>Dessert italien crémeux</p>
                <div class="price">8€</div>
                <button onclick="addToCart('Tiramisu',8)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/dessert3.jpg">
            <div class="card-content">
                <h3>Donuts</h3>
                <p>Donuts glacés premium</p>
                <div class="price">7€</div>
                <button onclick="addToCart('Donuts',9)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/dessert4.jpg">
            <div class="card-content">
                <h3>Glace Artisanale</h3>
                <p>Glace artisanale vanille</p>
                <div class="price">6€</div>
                <button onclick="addToCart('Glace Artisanale',6)">
                    Ajouter au panier
                </button>
            </div>
        </div>
    
    </div>
</section>

<!-- PANIER (IMPORTANT POUR AFFICHAGE + TOTAL) -->
<div class="cart-panel" id="cartPanel">

    <h2>Votre Panier</h2>

    <div id="cartItems"></div>

    <div class="cart-total">
        Total : <span id="total">0</span> €
    </div>

</div>

<!-- JS -->
<script src="cart.js"></script>

</body>
</html>
