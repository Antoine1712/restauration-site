<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzas</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="animations.css">
</head>
<body>

<div id="menu-container"></div>

<script>
fetch("menu.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("menu-container").innerHTML = data;
  });
</script>

<section class="menu">
    <h2 class="section-title">Nos Boissons</h2>

    <div class="menu-grid">

        <div class="card">
            <img src="images/boissons 1.jpg">
            <div class="card-content">
                <h3>Eau Vittel</h3>
                <p>50 cl</p>
                <div class="price">2,50€</div>
                <button onclick="addToCart('Eau Vittel',2.50)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/boissons 2.jpg">
            <div class="card-content">
                <h3>Coca Cola</h3>
                <p>33 cl</p>
                <div class="price">4,50€</div>
                <button onclick="addToCart('Coca Cola',4.50)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/boissons 3.jpg">
            <div class="card-content">
                <h3>Lipton</h3>
                <p>33 cl</p>
                <div class="price">4,20€</div>
                <button onclick="addToCart('Lipton',4.20)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/boissons 4.jpg">
            <div class="card-content">
                <h3>Bierre Blanche</h3>
                <p>25 cl</p>
                <div class="price">5€</div>
                <button onclick="addToCart('Bierre Blanche',5)">
                    Ajouter au panier
                </button>
            </div>
        </div>

    </div>
</section>

</body>
</html>
