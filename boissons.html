<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzas</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="animations.css">
</head>

<body>

<!-- MENU GLOBAL -->
<div id="menu-container"></div>

<script>
fetch("menu.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("menu-container").innerHTML = data;
  });
</script>

<!-- NAV PANIER -->
<nav class="nav">

    <div class="nav-spacer"></div>

    <a href="cart.html">
    🛒 <span id="cart-count">0</span>
    </a>

</nav>

<!-- SECTION BOISSONS -->
<section class="menu">
    <h2 class="section-title">Nos Boissons</h2>

    <div class="menu-grid">

        <div class="card">
            <img src="images/boissons 1.jpg">
            <div class="card-content">
                <h3>Eau Vittel</h3>
                <p>50 cl</p>
                <div class="price">2,50€</div>
                <button onclick="addToCart('Eau Vittel',2.50)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/boissons 2.jpg">
            <div class="card-content">
                <h3>Coca Cola</h3>
                <p>33 cl</p>
                <div class="price">4,50€</div>
                <button onclick="addToCart('Coca Cola',4.50)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/boissons 3.jpg">
            <div class="card-content">
                <h3>Lipton</h3>
                <p>33 cl</p>
                <div class="price">4,20€</div>
                <button onclick="addToCart('Lipton',4.20)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/boissons 4.jpg">
            <div class="card-content">
                <h3>Bierre Blanche</h3>
                <p>25 cl</p>
                <div class="price">5€</div>
                <button onclick="addToCart('Bierre Blanche',5)">
                    Ajouter au panier
                </button>
            </div>
        </div>

    </div>
</section>

<!-- PANIER (IMPORTANT POUR AFFICHAGE + TOTAL) -->
<div class="cart-panel" id="cartPanel">

    <h2>Votre Panier</h2>

    <div id="cartItems"></div>

    <div class="cart-total">
        Total : <span id="total">0</span> €
    </div>

</div>

<!-- JS -->
<script src="cart.js"></script>

</body>
</html>
