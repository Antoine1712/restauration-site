<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzas</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="animations.css">
</head>
<body>

<div id="menu-container"></div>

<script>
fetch("menu.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("menu-container").innerHTML = data;
  });
</script>

<section class="menu">
    <h2 class="section-title">Nos Pizzas</h2>

    <div class="menu-grid">

        <div class="card">
            <img src="images/pizza.jpg">
            <div class="card-content">
                <h3>Pizza Royale</h3>
                <p>Pizza artisanale italienne.</p>
                <div class="price">18€</div>
                <button onclick="addToCart('Pizza Royale',18)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/pizza1.jpg">
            <div class="card-content">
                <h3>4 Fromages</h3>
                <p>Mozzarella, chèvre, parmesan.</p>
                <div class="price">16€</div>
                <button onclick="addToCart('4 Fromages',16)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/pizza2.jpg">
            <div class="card-content">
                <h3>Pepperoni</h3>
                <p>Pepperoni premium épicé.</p>
                <div class="price">17€</div>
                <button onclick="addToCart('Pepperoni',17)">
                    Ajouter au panier
                </button>
            </div>
        </div>

        <div class="card">
            <img src="images/pizza3.jpg">
            <div class="card-content">
                <h3>Végétarienne</h3>
                <p>Légumes frais grillés.</p>
                <div class="price">15€</div>
                <button onclick="addToCart('Végétarienne',15)">
                    Ajouter au panier
                </button>
            </div>
        </div>

    </div>
</section>

</body>
</html>
