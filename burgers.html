<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgers</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="animations.css">
</head>
<body>

<div id="menu-container"></div>

<script>
fetch("menu.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("menu-container").innerHTML = data;
  });
</script>


<section class="menu">
    <h2 class="section-title">Nos Burgers</h2>

    <div class="menu-grid">

        <div class="card">
            <img src="images/burger.jpg">
            <div class="card-content">
                <h3>Classic Burger</h3>
                <p>Steak premium, cheddar, sauce maison.</p>
                <div class="price">14€</div>
            </div>
        </div>

        <div class="card">
            <img src="images/burger1.jpg">
            <div class="card-content">
                <h3>Double Beef</h3>
                <p>Double steak et fromage fondant.</p>
                <div class="price">18€</div>
            </div>
        </div>

        <div class="card">
            <img src="images/burger2.jpg">
            <div class="card-content">
                <h3>Chicken Burger</h3>
                <p>Poulet croustillant et sauce spicy.</p>
                <div class="price">15€</div>
            </div>
        </div>

        <div class="card">
            <img src="images/burger3.jpg">
            <div class="card-content">
                <h3>BBQ Burger</h3>
                <p>Sauce BBQ fumée et bacon grillé.</p>
                <div class="price">17€</div>
            </div>
        </div>

    </div>
</section>

</body>
</html>
